<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyPlanner</title>
    <!-- Apply saved theme before first paint to prevent flash of light mode -->
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/theme-toggles@4/css/classic.min.css"
    />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0d6efd" />
    <link rel="icon" href="icons/icon-192-transparent.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192-flat-try.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyPlanner" />

    <script>
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
      window.addEventListener("beforeunload", () => window.scrollTo(0, 0));
      window.addEventListener("load", () =>
        setTimeout(() => window.scrollTo(0, 0), 0),
      );
    </script>
  </head>

  <body>
    <div class="login-overlay" id="loginOverlay">
      <div class="login-box">
        <h1>MyPlanner</h1>
        <h3>Enter your login credentials</h3>

        <form id="loginForm">
          <div class="login-row">
            <div class="form-row">
              <label for="loginEmail">Email:</label>
              <input type="email" id="loginEmail" required />
            </div>
            <div class="form-row">
              <label for="loginPassword">Password:</label>
              <input type="password" id="loginPassword" required />
            </div>
          </div>
          <div class="wrap">
            <button type="submit">Log In</button>
            <button type="button" id="googleLogin" class="google-btn">
              <img src="img/google-logo2.svg" /> Sign in with Google
            </button>
          </div>
        </form>

        <div class="option">
          <p>
            Not registered? <a href="#" id="openSignup">Create a new account</a>
          </p>
          <button id="guestLogin" class="guest-btn">Try The Demo</button>
        </div>
      </div>
    </div>

    <div class="signup-overlay" id="signupOverlay">
      <div class="signup-box">
        <h1>MyPlanner</h1>
        <h3>Create a new account</h3>

        <form id="signupForm">
          <div class="signup-row">
            <div class="form-row">
              <label for="signupName">Display Name:</label>
              <input type="text" id="signupName" required />
            </div>
            <div class="form-row">
              <label for="signupEmail">Email:</label>
              <input type="email" id="signupEmail" required />
            </div>
            <div class="form-row">
              <label for="signupPassword">Password:</label>
              <input type="password" id="signupPassword" required />
            </div>
            <div class="form-row">
              <label for="signupRepeatPassword">Repeat Password:</label>
              <div class="input-tick-wrapper">
                <input type="password" id="signupRepeatPassword" required />
                <span class="input-tick" id="passwordMatchTick"></span>
              </div>
            </div>
          </div>
          <div class="wrap">
            <button type="submit">Create Account</button>
            <button type="button" id="googleSignup" class="google-btn">
              <img src="img/google-logo2.svg" /> Continue with Google
            </button>
          </div>
        </form>

        <div class="option">
          <p>Already have an account? <a href="#" id="openLogin">Log In</a></p>
          <button id="guestSignup" class="guest-btn">Try The Demo</button>
        </div>
      </div>
    </div>

    <div class="main-wrapper">
      <header>
        <h1
          title="Click to refresh"
          style="cursor: pointer"
          onclick="
            window.scrollTo(0, 0);
            location.reload();
          "
        >
          MyPlanner
        </h1>
        <section class="progress">
          <div class="progress-bar">
            <div id="progressFill"></div>
          </div>
        </section>
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="display: flex; align-items: center">
            <span id="currentUserDisplay"></span>
            <button id="loginBtn" class="general-btn" style="display: none">
              Login
            </button>
            <button id="logoutBtn" class="general-btn" style="display: none">
              Logout
            </button>
          </div>
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            title="Toggle theme"
            aria-label="Toggle theme"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
              width="1em"
              height="1em"
              fill="currentColor"
              stroke-linecap="round"
              class="theme-toggle__classic"
              viewBox="0 0 32 32"
            >
              <clipPath id="theme-toggle__classic__cutout">
                <path d="M0-5h30a1 1 0 0 0 9 13v24H0Z" />
              </clipPath>
              <g clip-path="url(#theme-toggle__classic__cutout)">
                <circle cx="16" cy="16" r="9.34" />
                <g stroke="currentColor" stroke-width="1.5">
                  <path d="M16 5.5v-4" />
                  <path d="M16 30.5v-4" />
                  <path d="M1.5 16h4" />
                  <path d="M26.5 16h4" />
                  <path d="m23.4 8.6 2.8-2.8" />
                  <path d="m5.7 26.3 2.9-2.9" />
                  <path d="m5.8 5.8 2.8 2.8" />
                  <path d="m23.4 23.4 2.9 2.9" />
                </g>
              </g>
            </svg>
          </button>
        </div>
      </header>

      <main class="main-content">
        <div id="introWrapper">
          <section class="intro-area">
            <div class="splash-logo-wrap" aria-hidden="true">
              <svg
                class="splash-logo-svg"
                viewBox="0 0 100 100"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle
                  class="splash-circle"
                  cx="50"
                  cy="50"
                  r="42"
                  stroke="#4a7afe"
                  stroke-width="7"
                  stroke-linecap="round"
                  stroke-dasharray="264"
                  stroke-dashoffset="264"
                />
                <path
                  class="splash-tick"
                  d="M27 52 L42 68 L73 34"
                  stroke="#4a7afe"
                  stroke-width="7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-dasharray="70"
                  stroke-dashoffset="70"
                />
              </svg>
            </div>
            <h1 id="introGreeting"></h1>
            <p>Track your tasks and goals all in one place.</p>
          </section>
        </div>

        <div id="introSentinel"></div>

        <button
          id="scrollTopBtn"
          class="scroll-top-btn"
          title="Back to top"
          aria-label="Scroll to top"
        >
          ↑
        </button>

        <button
          id="scrollTopBtnRight"
          class="scroll-top-btn scroll-top-btn--right"
          title="Back to top"
          aria-label="Scroll to top"
        >
          ↑
        </button>

        <section class="input-area">
          <input type="text" id="taskInput" placeholder="Add a new task..." />

          <div class="dropdown">
            <button id="dropdownToggle" class="general-btn">
              Choose Category
              <span id="chooseCatArrow"
                ><img src="img/dropdown-arrow.svg"
              /></span>
            </button>
            <div id="dropdownMenu" class="dropdown-menu"></div>
          </div>

          <div class="calendar-wrap">
            <button id="calendarBtn" class="calendar-btn">
              <img src="img/icons8-calendar-24.png" />
            </button>
            <input type="date" id="dateAdd" />
          </div>

          <button id="addTask" class="general-btn">Add</button>

          <button id="searchToggle" class="general-btn">
            Search
            <span id="searchArrow"><img src="img/dropdown-arrow.svg" /></span>
          </button>
        </section>

        <div class="search-dropdown" id="searchDropdown">
          <input
            type="text"
            id="searchInput"
            placeholder="What do you want to search for?"
          />
          <button id="searchSubmit" class="general-btn">Search</button>
          <button id="searchReset" class="reset-btn">Reset</button>
        </div>

        <section class="search-response">
          <h3>Search Results:</h3>
          <p id="searchOutput">Your search results will appear here...</p>
        </section>

        <section class="task-list">
          <h2>Your Tasks</h2>
          <div class="task-filters-row">
            <section class="task-filters tab-group">
              <span class="tab-indicator"></span>
            </section>
            <button
              id="viewToggle"
              class="view-toggle-btn"
              title="Switch to calendar view"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
              </svg>
              Calendar
            </button>
          </div>
          <ul id="tasks"></ul>
        </section>
      </main>

      <footer class="site-footer"></footer>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
      import { getFirestore } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
      import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged,
        GoogleAuthProvider,
        signInWithPopup,
        signInWithRedirect,
        getRedirectResult,
        updateProfile,
      } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyD2xU7vC6eo5Hn5biVHPeYd1vUibnIwp0o",
        authDomain: "mypanner-77655.web.app",
        projectId: "mypanner-77655",
        storageBucket: "mypanner-77655.firebasestorage.app",
        messagingSenderId: "70262178120",
        appId: "1:70262178120:web:7b1701e7d5c22325ceb37d",
        measurementId: "G-84XGBF49S9",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      window.db = db;

      const loginOverlay = document.getElementById("loginOverlay");
      const signupOverlay = document.getElementById("signupOverlay");
      const openSignup = document.getElementById("openSignup");
      const openLogin = document.getElementById("openLogin");
      const loginForm = document.getElementById("loginForm");
      const signupForm = document.getElementById("signupForm");
      const logoutBtn = document.getElementById("logoutBtn");
      const loginBtn = document.getElementById("loginBtn");
      const currentUserDisplay = document.getElementById("currentUserDisplay");
      const guestLoginBtn = document.getElementById("guestLogin");
      const guestSignupBtn = document.getElementById("guestSignup");

      const provider = new GoogleAuthProvider();

      openSignup.addEventListener("click", (e) => {
        e.preventDefault();
        loginOverlay.style.display = "none";
        signupOverlay.style.display = "flex";
      });

      const signupPasswordInput = document.getElementById("signupPassword");
      const signupRepeatInput = document.getElementById("signupRepeatPassword");
      const passwordMatchTick = document.getElementById("passwordMatchTick");

      function checkPasswordMatch() {
        const pw = signupPasswordInput.value;
        const repeat = signupRepeatInput.value;

        if (repeat.length === 0) {
          passwordMatchTick.classList.remove(
            "visible",
            "tick-match",
            "tick-mismatch",
          );
          return;
        }

        if (pw === repeat) {
          passwordMatchTick.innerHTML =
            '<img src="img/icons8-tick-100.png" class="tick-icon" />';
          passwordMatchTick.classList.remove("tick-mismatch");
          passwordMatchTick.classList.add("visible", "tick-match");
        } else {
          passwordMatchTick.textContent = "✕";
          passwordMatchTick.classList.remove("tick-match");
          passwordMatchTick.classList.add("visible", "tick-mismatch");
        }
      }

      signupPasswordInput.addEventListener("input", checkPasswordMatch);
      signupRepeatInput.addEventListener("input", checkPasswordMatch);

      openLogin.addEventListener("click", (e) => {
        e.preventDefault();
        signupOverlay.style.display = "none";
        loginOverlay.style.display = "flex";
      });

      let _greetingDotsInterval = null;
      function setGreetingWithDots(el, text) {
        if (_greetingDotsInterval) clearInterval(_greetingDotsInterval);
        el.innerHTML =
          text +
          '<span class="gdot">.</span>' +
          '<span class="gdot">.</span>' +
          '<span class="gdot">.</span>';
        const dots = el.querySelectorAll(".gdot");
        dots.forEach((d) => {
          d.style.opacity = "0";
          d.style.transition = "opacity 0.4s ease";
        });
        let n = 0;
        _greetingDotsInterval = setInterval(() => {
          n = (n + 1) % 4;
          dots.forEach((d, i) => {
            d.style.opacity = i < n ? "1" : "0";
          });
        }, 500);
      }

      // Set a day-based greeting immediately so the CSS splash animation
      // (which fires at 1.75s) always has text ready — auth may resolve later.
      // Uses a cached name from localStorage so the personalised version shows
      // straight away on every load after the first login.
      (function () {
        const el = document.getElementById("introGreeting");
        if (!el) return;
        const n = localStorage.getItem("cachedUserName");
        const g = n
          ? [
              `A fresh week starts tomorrow, ${n}`,
              `New week, let's get organised, ${n}`,
              `Keep the momentum going, ${n}`,
              `Halfway there, stay on track, ${n}`,
              `Almost the weekend, push through, ${n}`,
              `Finish the week strong, ${n}`,
              `Even weekends need a plan, ${n}`,
            ]
          : [
              "Plan your week",
              "New week, let's get organised",
              "Keep the momentum going",
              "Halfway there, stay on track",
              "Almost the weekend, push through",
              "Finish the week strong",
              "Even weekends need a plan",
            ];
        setGreetingWithDots(el, g[new Date().getDay()]);
      })();

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          loginOverlay.style.display = "none";
          signupOverlay.style.display = "none";
          document.body.classList.remove("overlay-active");
          logoutBtn.style.display = "block";
          loginBtn.style.display = "none";
          currentUserDisplay.textContent = `Hello, ${(user.displayName || user.email).split(" ")[0]}`;
          const _name = (user.displayName || user.email).split(" ")[0];
          localStorage.setItem("cachedUserName", _name);
          const _dayGreetings = [
            `A fresh week starts tomorrow, ${_name}`,
            `New week, let's get organised, ${_name}`,
            `Keep the momentum going, ${_name}`,
            `Halfway there, stay on track, ${_name}`,
            `Almost the weekend, push through, ${_name}`,
            `Finish the week strong, ${_name}`,
            `Even weekends need a plan, ${_name}`,
          ];
          const _introEl = document.getElementById("introGreeting");
          if (_introEl) {
            setGreetingWithDots(_introEl, _dayGreetings[new Date().getDay()]);
          }
          window.currentFirebaseUser = user;
          window.dispatchEvent(new Event("userLoggedIn"));
        } else {
          const isGuest = localStorage.getItem("currentUser") === "guest";
          if (isGuest) {
            loginOverlay.style.display = "none";
            signupOverlay.style.display = "none";
            document.body.classList.remove("overlay-active");
            logoutBtn.style.display = "none";
            loginBtn.style.display = "block";
            currentUserDisplay.textContent = "Hello, Demo";
            const _guestGreetings = [
              "Plan your week",
              "New week, let's get organised",
              "Keep the momentum going",
              "Halfway there, stay on track",
              "Almost the weekend, push through",
              "Finish the week strong",
              "Even weekends need a plan",
            ];
            const _introElGuest = document.getElementById("introGreeting");
            if (_introElGuest) {
              setGreetingWithDots(_introElGuest, _guestGreetings[new Date().getDay()]);
            }
            window.dispatchEvent(new Event("userLoggedIn"));
          } else {
            document.body.classList.add("overlay-active");
            loginOverlay.style.display = "flex";
          }
        }
      });

      signupForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = signupForm.querySelector("button[type='submit']");
        btn.disabled = true;

        const name = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail").value.trim();
        const password = document.getElementById("signupPassword").value;
        const repeat = document.getElementById("signupRepeatPassword").value;

        if (password !== repeat) {
          alert("Passwords do not match");
          btn.disabled = false;
          return;
        }
        if (password.length < 6) {
          alert("Password must be at least 6 characters");
          btn.disabled = false;
          return;
        }
        if (name.length < 2) {
          alert("Display name must be at least 2 characters");
          btn.disabled = false;
          return;
        }

        try {
          const result = await createUserWithEmailAndPassword(
            auth,
            email,
            password,
          );
          await updateProfile(result.user, { displayName: name });
        } catch (err) {
          alert(err.message);
          btn.disabled = false;
        }
      });

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;
        try {
          await signInWithEmailAndPassword(auth, email, password);
        } catch (err) {
          alert("Invalid email or password");
        }
      });

      const isPWA =
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;

      async function googleSignIn() {
        try {
          if (isPWA) {
            await signInWithRedirect(auth, provider);
          } else {
            await signInWithPopup(auth, provider);
          }
        } catch (err) {
          alert(err.message);
        }
      }

      getRedirectResult(auth).catch((err) => {
        if (err && err.code && err.code !== "auth/no-auth-event") {
          console.error("Redirect sign-in error:", err);
        }
      });

      document
        .getElementById("googleLogin")
        .addEventListener("click", googleSignIn);
      document
        .getElementById("googleSignup")
        .addEventListener("click", googleSignIn);

      function continueAsGuest() {
        localStorage.setItem("currentUser", "guest");
        location.reload();
      }
      guestLoginBtn.addEventListener("click", continueAsGuest);
      guestSignupBtn.addEventListener("click", continueAsGuest);

      logoutBtn.addEventListener("click", async () => {
        localStorage.removeItem("currentUser");
        localStorage.removeItem("cachedUserName");
        await signOut(auth);
        location.reload();
      });

      loginBtn.addEventListener("click", () => {
        localStorage.removeItem("currentUser");
        location.reload();
      });

      document.body.classList.add("overlay-active");
    </script>
    <script type="module" src="script.js"></script>

    <script>
      /* Splash logo stroke animation — JS only, no !important CSS conflicts */
      (function () {
        if (window.innerWidth > 480) return;

        var CIRCLE_LEN = 264; /* 2π × 42 */
        var TICK_LEN = 70; /* path M27,52 L42,68 L73,34 */

        function ease(t) {
          return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        }

        function animateDash(el, len, ms, onDone) {
          el.style.strokeDasharray = len;
          el.style.strokeDashoffset = len;
          var start = null;
          function step(ts) {
            if (!start) start = ts;
            var p = Math.min((ts - start) / ms, 1);
            el.style.strokeDashoffset = len * (1 - ease(p));
            if (p < 1) {
              requestAnimationFrame(step);
            } else {
              el.style.strokeDashoffset = 0;
              if (onDone) onDone();
            }
          }
          requestAnimationFrame(step);
        }

        document.addEventListener("DOMContentLoaded", function () {
          var circle = document.querySelector(".splash-circle");
          var tick = document.querySelector(".splash-tick");
          if (!circle || !tick) return;
          setTimeout(function () {
            animateDash(circle, CIRCLE_LEN, 900, function () {
              animateDash(tick, TICK_LEN, 550, null);
            });
          }, 300);
        });
      })();
    </script>
  </body>
</html>
