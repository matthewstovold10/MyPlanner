<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyPlanner</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0d6efd" />
    <link rel="icon" href="icons/icon-512.png" type="image/png" />

    <script>
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
      window.addEventListener("beforeunload", () => window.scrollTo(0, 0));
      window.addEventListener("load", () =>
        setTimeout(() => window.scrollTo(0, 0), 0),
      );
    </script>
  </head>

  <body>
    <div class="login-overlay" id="loginOverlay">
      <div class="login-box">
        <h1>MyPlanner</h1>
        <h3>Enter your login credentials</h3>

        <form id="loginForm">
          <div class="login-row">
            <div class="form-row">
              <label for="loginEmail">Email:</label>
              <input type="email" id="loginEmail" required />
            </div>
            <div class="form-row">
              <label for="loginPassword">Password:</label>
              <input type="password" id="loginPassword" required />
            </div>
          </div>
          <div class="wrap">
            <button type="submit">Log In</button>
            <button type="button" id="googleLogin" class="google-btn">
              <img src="img/google-logo.svg" /> Sign in with Google
            </button>
          </div>
        </form>

        <div class="option">
          <p>
            Not registered? <a href="#" id="openSignup">Create a new account</a>
          </p>
          <button id="guestLogin" class="guest-btn">Continue as Guest</button>
        </div>
      </div>
    </div>

    <div class="signup-overlay" id="signupOverlay">
      <div class="signup-box">
        <h1>MyPlanner</h1>
        <h3>Create a new account</h3>

        <form id="signupForm">
          <div class="signup-row">
            <div class="form-row">
              <label for="signupName">Display Name:</label>
              <input type="text" id="signupName" required />
            </div>
            <div class="form-row">
              <label for="signupEmail">Email:</label>
              <input type="email" id="signupEmail" required />
            </div>
            <div class="form-row">
              <label for="signupPassword">Password:</label>
              <input type="password" id="signupPassword" required />
            </div>
            <div class="form-row">
              <label for="signupRepeatPassword">Repeat Password:</label>
              <input type="password" id="signupRepeatPassword" required />
            </div>
          </div>
          <div class="wrap">
            <button type="submit">Create Account</button>
            <button type="button" id="googleSignup" class="google-btn">
              <img src="img/google-logo.svg" /> Continue with Google
            </button>
          </div>
        </form>

        <div class="option">
          <p>Already have an account? <a href="#" id="openLogin">Log In</a></p>
          <button id="guestSignup" class="guest-btn">Continue as Guest</button>
        </div>
      </div>
    </div>

    <div class="main-wrapper">
      <header>
        <h1>MyPlanner</h1>
        <section class="progress">
          <div class="progress-bar">
            <div id="progressFill"></div>
          </div>
        </section>
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="display: flex; align-items: center">
            <span id="currentUserDisplay"></span>
            <button id="loginBtn" class="general-btn" style="display: none">
              Login
            </button>
            <button id="logoutBtn" class="general-btn" style="display: none">
              Logout
            </button>
          </div>
          <label class="theme-switch">
            <input type="checkbox" id="theme-toggle" />
            <span class="slider"></span>
          </label>
        </div>
      </header>

      <main class="main-content">
        <div id="introWrapper">
          <section class="intro-area">
            <h1>Stay organised, Stay productive</h1>
            <p>Track your tasks and goals all in one place.</p>
          </section>
        </div>

        <div id="introSentinel"></div>

        <section class="input-area">
          <input type="text" id="taskInput" placeholder="Add a new task..." />

          <div class="dropdown">
            <button id="dropdownToggle" class="general-btn">
              Choose Category
              <span id="chooseCatArrow"
                ><img src="img/dropdown-arrow.svg"
              /></span>
            </button>
            <div id="dropdownMenu" class="dropdown-menu"></div>
          </div>

          <div class="calendar-wrap">
            <button id="calendarBtn" class="calendar-btn">
              <img src="img/icons8-calendar-24.png" />
            </button>
            <input type="date" id="dateAdd" />
          </div>

          <button id="addTask" class="general-btn">Add</button>

          <button id="askAIToggle" class="general-btn">
            Search
            <span id="askAIArrow"><img src="img/dropdown-arrow.svg" /></span>
          </button>
        </section>

        <div class="ai-dropdown" id="aiDropdown">
          <input
            type="text"
            id="AIInput"
            placeholder="What do you want to search for?"
          />
          <button id="askAISubmit" class="general-btn">Search</button>
        </div>

        <section class="ai-response">
          <h3>AI Response:</h3>
          <p id="AIOutput">Your AI results will appear here...</p>
        </section>

        <section class="task-list">
          <h2>Your Tasks</h2>
          <section class="task-filters tab-group">
            <span class="tab-indicator"></span>
          </section>
          <ul id="tasks"></ul>
        </section>
      </main>

      <footer class="site-footer"></footer>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
      import { getFirestore } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
      import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged,
        GoogleAuthProvider,
        signInWithPopup,
        updateProfile,
      } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyD2xU7vC6eo5Hn5biVHPeYd1vUibnIwp0o",
        authDomain: "mypanner-77655.firebaseapp.com",
        projectId: "mypanner-77655",
        storageBucket: "mypanner-77655.firebasestorage.app",
        messagingSenderId: "70262178120",
        appId: "1:70262178120:web:7b1701e7d5c22325ceb37d",
        measurementId: "G-84XGBF49S9",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      window.db = db;

      const loginOverlay = document.getElementById("loginOverlay");
      const signupOverlay = document.getElementById("signupOverlay");
      const openSignup = document.getElementById("openSignup");
      const openLogin = document.getElementById("openLogin");
      const loginForm = document.getElementById("loginForm");
      const signupForm = document.getElementById("signupForm");
      const logoutBtn = document.getElementById("logoutBtn");
      const loginBtn = document.getElementById("loginBtn");
      const currentUserDisplay = document.getElementById("currentUserDisplay");
      const guestLoginBtn = document.getElementById("guestLogin");
      const guestSignupBtn = document.getElementById("guestSignup");

      const provider = new GoogleAuthProvider();

      openSignup.addEventListener("click", (e) => {
        e.preventDefault();
        loginOverlay.style.display = "none";
        signupOverlay.style.display = "flex";
      });

      openLogin.addEventListener("click", (e) => {
        e.preventDefault();
        signupOverlay.style.display = "none";
        loginOverlay.style.display = "flex";
      });

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          loginOverlay.style.display = "none";
          signupOverlay.style.display = "none";
          document.body.classList.remove("overlay-active");
          logoutBtn.style.display = "block";
          loginBtn.style.display = "none";
          currentUserDisplay.textContent = `Hello, ${user.displayName || user.email}`;
          window.currentFirebaseUser = user;
          window.dispatchEvent(new Event("userLoggedIn"));
        } else {
          const isGuest = localStorage.getItem("currentUser") === "guest";
          if (isGuest) {
            loginOverlay.style.display = "none";
            signupOverlay.style.display = "none";
            document.body.classList.remove("overlay-active");
            logoutBtn.style.display = "none";
            loginBtn.style.display = "block";
            currentUserDisplay.textContent = "Guest";
            window.dispatchEvent(new Event("userLoggedIn"));
          } else {
            document.body.classList.add("overlay-active");
            loginOverlay.style.display = "flex";
          }
        }
      });

      signupForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = signupForm.querySelector("button[type='submit']");
        btn.disabled = true;

        const name = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail").value.trim();
        const password = document.getElementById("signupPassword").value;
        const repeat = document.getElementById("signupRepeatPassword").value;

        if (password !== repeat) {
          alert("Passwords do not match");
          btn.disabled = false;
          return;
        }
        if (password.length < 6) {
          alert("Password must be at least 6 characters");
          btn.disabled = false;
          return;
        }
        if (name.length < 2) {
          alert("Display name must be at least 2 characters");
          btn.disabled = false;
          return;
        }

        try {
          const result = await createUserWithEmailAndPassword(
            auth,
            email,
            password,
          );
          await updateProfile(result.user, { displayName: name });
        } catch (err) {
          alert(err.message);
          btn.disabled = false;
        }
      });

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;
        try {
          await signInWithEmailAndPassword(auth, email, password);
        } catch (err) {
          alert("Invalid email or password");
        }
      });

      async function googleSignIn() {
        try {
          await signInWithPopup(auth, provider);
        } catch (err) {
          alert(err.message);
        }
      }

      document
        .getElementById("googleLogin")
        .addEventListener("click", googleSignIn);
      document
        .getElementById("googleSignup")
        .addEventListener("click", googleSignIn);

      function continueAsGuest() {
        localStorage.setItem("currentUser", "guest");
        location.reload();
      }
      guestLoginBtn.addEventListener("click", continueAsGuest);
      guestSignupBtn.addEventListener("click", continueAsGuest);

      logoutBtn.addEventListener("click", async () => {
        localStorage.removeItem("currentUser");
        await signOut(auth);
        location.reload();
      });

      loginBtn.addEventListener("click", () => {
        localStorage.removeItem("currentUser");
        location.reload();
      });

      document.body.classList.add("overlay-active");
    </script>
    <script type="module" src="script.js"></script>
  </body>
</html>
